<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vastra Sanvedan | Admin Login</title>
  <style>
    :root {
      --bg: #e9efec;
      --panel: rgba(248,251,247,.84);
      --ink: #101b22;
      --muted: #64747a;
      --line: rgba(16,27,34,.13);
      --accent: #c99d4f;
      --button: #101b22;
      --button-text: #f8fbf7;
      --danger: #a13f48;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 12% 8%, rgba(201,157,79,.2), transparent 25%), radial-gradient(circle at 88% 82%, rgba(38,108,103,.18), transparent 30%), var(--bg);
      font-family: "Outfit", "Segoe UI", sans-serif;
      color: var(--ink);
    }
    .panel {
      width: min(92vw, 420px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 28px 70px rgba(16,27,34,.16), 0 5px 14px rgba(16,27,34,.08), inset 0 1px 0 rgba(255,255,255,.85);
      backdrop-filter: blur(18px);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 2.5rem);
      letter-spacing: -0.04em;
      color: var(--ink);
    }
    p { margin: 0 0 20px; color: var(--muted); }
    label {
      display: block;
      margin-bottom: 18px;
      font-size: 0.95rem;
      color: var(--ink);
    }
    input {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.78);
      font-size: 1rem;
      color: var(--ink);
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #101b22, #266c67);
      color: var(--button-text);
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 14px 26px rgba(16,27,34,.2), inset 0 1px 0 rgba(255,255,255,.18);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 20px 30px rgba(16,27,34,.24); }
    .notice {
      min-height: 20px;
      margin: 0 0 12px;
      color: var(--danger);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Admin Login</h1>
    <p>Enter the admin password to access the control panel.</p>
    <div id="notice" class="notice" aria-live="polite"></div>
    <form id="loginForm">
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter admin password" required />
      </label>
      <button type="submit">Open dashboard</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const notice = document.getElementById('notice');
    const passwordInput = document.getElementById('password');

    function showNotice(text, isError = true) {
      notice.textContent = text || '';
      notice.style.color = isError ? '#8a2f2f' : '#1d5a3a';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      showNotice('');
      const password = passwordInput.value.trim();
      if (!password) {
        showNotice('Password is required.');
        return;
      }
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || 'Login failed.');
        window.location.href = '/admin';
      } catch (error) {
        showNotice(error.message || 'Invalid password.');
      }
    });
  </script>
</body>
</html>
