<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vastra Sanvedan | Admin Login</title>
  <style>
    :root {
      --bg: #f4efe8;
      --panel: #fbf8f3;
      --ink: #1c1814;
      --muted: #7b7369;
      --line: rgba(28,24,20,0.12);
      --accent: #d9c3a0;
      --button: #1c1814;
      --button-text: #f7f2ea;
      --danger: #8a2f2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f7f3ee 0%, #f0e9e1 100%);
      font-family: "Outfit", "Segoe UI", sans-serif;
      color: var(--ink);
    }
    .panel {
      width: min(92vw, 420px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 32px 24px;
      box-shadow: 0 18px 48px rgba(28,24,20,0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 2.5rem);
      letter-spacing: -0.04em;
    }
    p { margin: 0 0 20px; color: var(--muted); }
    label {
      display: block;
      margin-bottom: 18px;
      font-size: 0.95rem;
      color: var(--ink);
    }
    input {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffdf9;
      font-size: 1rem;
      color: var(--ink);
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: var(--button);
      color: var(--button-text);
      font-weight: 600;
      cursor: pointer;
    }
    .notice {
      min-height: 20px;
      margin: 0 0 12px;
      color: var(--danger);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Admin Login</h1>
    <p>Enter the admin password to access the control panel.</p>
    <div id="notice" class="notice" aria-live="polite"></div>
    <form id="loginForm">
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter admin password" required />
      </label>
      <button type="submit">Open dashboard</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const notice = document.getElementById('notice');
    const passwordInput = document.getElementById('password');

    function showNotice(text, isError = true) {
      notice.textContent = text || '';
      notice.style.color = isError ? '#8a2f2f' : '#1d5a3a';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      showNotice('');
      const password = passwordInput.value.trim();
      if (!password) {
        showNotice('Password is required.');
        return;
      }
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || 'Login failed.');
        window.location.href = '/admin';
      } catch (error) {
        showNotice(error.message || 'Invalid password.');
      }
    });
  </script>
</body>
</html>
