<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a1714">
<title>Vastra Sanvedan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/store.css">
<link rel="stylesheet" href="/store-premium.css">
</head>
<body>
<div class="cinematic-intro" id="cinematicIntro" aria-hidden="true">
  <div class="intro-light"></div>
  <div class="intro-frame">
    <span class="intro-mark">VS</span>
    <strong>Vastra Sanvedan</strong>
    <small>style that feel like you</small>
  </div>
</div>
<div class="site-ambient" aria-hidden="true">
  <canvas class="ambient-canvas" id="ambientCanvas"></canvas>
  <span class="ambient-glow ambient-glow-one"></span>
  <span class="ambient-glow ambient-glow-two"></span>
  <span class="ambient-ribbon ambient-ribbon-one"></span>
  <span class="ambient-ribbon ambient-ribbon-two"></span>
</div>
<div class="promo" id="promo"></div>
<header class="header" id="header">
  <div class="header-left">
    <button class="icon-btn" id="menuOpen" aria-label="Open menu">☰</button>
    <a class="back-home" id="backHome" href="/" aria-label="Back to main website">&larr; Back</a>
    <a class="brand" href="/">
      <span class="brand-mark" id="brandMark">VS</span>
      <span class="brand-copy"><strong id="brandName">Vastra Sanvedan</strong><small id="brandTag">Est. atelier</small></span>
    </a>
  </div>
  <nav class="desktop-nav" aria-label="Primary navigation">
    <a href="/shop">Collection</a>
    <a href="/women">Women</a>
    <a href="/men">Men</a>
    <a href="/home-living">Home</a>
  </nav>
  <div class="header-right">
    <button class="icon-btn" id="searchOpen" aria-label="Search">Search</button>
  </div>
</header>

<aside class="menu" id="menu" hidden>
  <div class="menu-panel">
    <div class="menu-top">
      <span>Menu</span>
      <button class="icon-btn" id="menuClose" aria-label="Close menu">×</button>
    </div>
    <nav class="menu-nav">
      <a href="/men">Men</a>
      <a href="/women">Women</a>
      <a href="/kids">Kids</a>
      <a href="/home-living">Home / Living</a>
      <a href="/contact">Contact us</a>
      <a href="/faqs">FAQs</a>
      <a href="/legal">Legal</a>
      <a href="/shop">Shop</a>
      <a href="/admin">Admin Panel</a>
    </nav>
  </div>
</aside>

<main id="app"><div class="state">Loading the house...</div></main>
<footer class="footer"><p id="footerBrand">Vastra Sanvedan</p><small id="footerText">A considered wardrobe. One inventory. Online and in-store.</small><br><a href="/admin" style="color:var(--ink);text-decoration:none;opacity:.7;">Admin Panel</a></footer>

<div class="overlay" id="searchOverlay" hidden>
  <div class="search-sheet">
    <button class="icon-btn close-x" id="searchClose" aria-label="Close search">×</button>
    <input id="searchInput" placeholder="Search the collection" autocomplete="off">
    <div class="filters">
      <select id="filterCategory"><option value="">All categories</option></select>
      <input id="filterMin" type="number" min="0" placeholder="Min ₹">
      <input id="filterMax" type="number" min="0" placeholder="Max ₹">
    </div>
    <div id="searchResults" class="product-grid"></div>
  </div>
</div>

<div class="overlay" id="modal" hidden>
  <div class="modal-box" id="modalBox"></div>
</div>

<script src="/shop.js"></script>
</body>
</html>
